# calendar-busy-sync — a distributable conductor pack.
#
# Keep several Google calendars honest about when you are busy. Every event on
# a SOURCE calendar gets a "Busy" block on every other TARGET calendar, so a
# colleague looking at your work calendar sees the time your personal (or other
# job's) calendar already holds. Blocks follow the source: moved when it moves,
# removed when it is cancelled, declined, or marked free. A repeating event
# gets one repeating block.
#
# Pure verbs + two small js steps — no agent, no model, no cost.
#
# Define-behavior / bind-environment: this pack ships only BEHAVIOR (one
# workflow, two disarmed triggers). It carries NO connectors and NO secrets —
# you bind your own `google-calendar` connectors (one per calendar) and a cron
# schedule in the `packs:` block. See README.md for the Google OAuth setup.
#
# Install (in your config's `packs:` block):
#   connectors:
#     timer:        { use: cron, schedules: { busy_sync: { every: 15m } } }
#     cal-personal: { use: google-calendar, auth: { … } }   # + watch: { … } for on_change
#     cal-work:     { use: google-calendar, auth: { … } }
#     cal-side:     { use: google-calendar, auth: { … } }
#   packs:
#     busy:
#       source: github.com/NodeSpy/conductor-packs//calendar-busy-sync
#       version: "=0.1.0"
#       connectors:
#         sources: [cal-personal, cal-work, cal-side]   # whose events block time
#         targets: [cal-work, cal-side]                 # where the blocks are written
#         cron: timer
#       triggers:
#         sweep:     { enabled: true }   # the periodic pass; keep it armed
#         on_change: { enabled: true }   # optional: push-driven, needs watch: on each source
#   Then: `conductor init`, `conductor pack plan`, `conductor validate`.

pack:
  name: calendar-busy-sync
  version: 0.1.0
  description: Mirror busy time across Google calendars — every event on a source calendar becomes a private "Busy" block on the other target calendars, kept in step by push + a sweep. Pure verbs, no agent.
  tags: [calendar, google, scheduling]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # >=0.106.0: list sockets (`many: true`) and the `over:`/`member:` step
    # fields that address them. Older daemons reject this manifest at parse.
    conductor: ">=0.106.0"
    connectors:
      # List sockets: you name every calendar the pack may read and write.
      # A calendar may sit in both lists (two work calendars that block each
      # other); it never receives a block for its own events.
      # >=1.2.0: the `changed` push source and paged `events`.
      sources: { many: true, type: google-calendar, version: ">=1.2.0" }
      targets: { many: true, type: google-calendar, version: ">=1.2.0" }
      # The sweep schedule. Your cron connector must declare `busy_sync`.
      cron: "*"

settings:
  window_days:
    type: integer
    default: 30
    desc: "How far ahead to mirror. Blocks beyond this appear as the window rolls forward."
  block_title:
    type: string
    default: Busy
    desc: "Title of a block. Used for every block unless show_details is on."
  show_details:
    type: boolean
    default: false
    desc: "Copy the source event's title onto the block instead of block_title. Blocks stay private either way."
  color_id:
    type: string
    default: "8"
    desc: "Google event colour id for blocks (1-11; 8 is graphite). Empty leaves the calendar's own colour."
  mirror_all_day:
    type: boolean
    default: false
    desc: "Also mirror all-day events that are marked busy. Off by default: most all-day events are reminders."
  tag:
    type: string
    default: conductorBusySync
    desc: "Private extended-property name that marks a block as this pack's. Change it only to run two independent instances over the same calendar."
  max_deletes:
    type: integer
    default: 50
    desc: "Refuse a run that would delete more than this many blocks whose source events have vanished — a guard against a bad read wiping every block."
  remove_all:
    type: boolean
    default: false
    desc: "Remove every block in the window instead of syncing. Leave it on for a few sweeps before uninstalling, then disarm."
  batch_size:
    type: integer
    default: 50
    desc: "Most blocks created, moved or removed per run (each counted separately). The rest follow on the next runs. Keep it under your policy.max_fan_out (100 by default)."
  dry_run:
    type: boolean
    default: false
    desc: "Plan and log only; create, move and delete nothing."

workflows:
  # One full reconcile. Stateless: it reads every source and target for the
  # window, works out which blocks should exist, and makes the targets match.
  # Running it twice is a no-op, so the push trigger and the sweep share it.
  reconcile:
    description: "Make every target calendar's busy blocks match the source calendars' events."
    steps:
      # Settings are substituted as text, so they cross into js as strings.
      - id: cfg
        set:
          window_days: "${settings.window_days}"
          block_title: "${settings.block_title}"
          show_details: "${settings.show_details}"
          color_id: "${settings.color_id}"
          mirror_all_day: "${settings.mirror_all_day}"
          tag: "${settings.tag}"
          max_deletes: "${settings.max_deletes}"
          batch_size: "${settings.batch_size}"
          remove_all: "${settings.remove_all}"

      - id: window
        use: js
        code: |
          const days = parseInt(ctx.cfg.window_days, 10);
          if (!(days > 0)) throw new Error("window_days must be a positive integer");
          const now = new Date();
          if (now.getUTCFullYear() < 2025) throw new Error("js clock looks wrong: " + now.toISOString());
          // Clearing reaches back a year as well, to take blocks already past.
          const back = String(ctx.cfg.remove_all) === "true" ? 366 : 0;
          return {
            timeMin: new Date(now.getTime() - back * 86400000).toISOString(),
            timeMax: new Date(now.getTime() + days * 86400000).toISOString(),
          };

      # Every calendar is read twice. EXPANDED (singleEvents), each occurrence
      # of a repeating event is its own item: that decides which occurrences
      # need a block. RAW, a repeating event is one item carrying its recurrence
      # rule, plus one item per changed or cancelled occurrence: that is what
      # lets a repeating event get ONE repeating block instead of dozens.
      # A failed read fails the run here — nothing is deleted on a partial picture.
      - id: src
        uses: sources.events
        over: true
        options:
          timeMin: "{{.window.timeMin}}"
          timeMax: "{{.window.timeMax}}"
          singleEvents: true
          maxResults: 2500

      - id: srcraw
        uses: sources.events
        over: true
        options:
          timeMin: "{{.window.timeMin}}"
          timeMax: "{{.window.timeMax}}"
          singleEvents: false
          maxResults: 2500

      # The targets are read whole (not just this pack's blocks): the plan also
      # needs the target's own events, to leave alone time it already has busy.
      - id: dst
        uses: targets.events
        over: true
        options:
          timeMin: "{{.window.timeMin}}"
          timeMax: "{{.window.timeMax}}"
          singleEvents: true
          maxResults: 2500

      - id: dstraw
        uses: targets.events
        over: true
        options:
          timeMin: "{{.window.timeMin}}"
          timeMax: "{{.window.timeMax}}"
          singleEvents: false
          maxResults: 2500

      - id: plan
        use: js
        code: |
          const cfg = ctx.cfg;
          const TAG = cfg.tag;
          const SIG = TAG + "Sig";
          const yes = (v) => String(v) === "true";
          const showDetails = yes(cfg.show_details);
          const mirrorAllDay = yes(cfg.mirror_all_day);
          const removeAll = yes(cfg.remove_all);
          const maxDeletes = parseInt(cfg.max_deletes, 10);
          const batch = parseInt(cfg.batch_size, 10);
          if (!(batch > 0)) throw new Error("batch_size must be a positive integer");

          const members = (o) => (o && o.by_member) || {};
          const itemsOf = (v) => (Array.isArray(v) ? v : (v && v.items) || []);
          const srcBy = members(ctx.src), srcRawBy = members(ctx.srcraw);
          const dstBy = members(ctx.dst), dstRawBy = members(ctx.dstraw);

          const priv = (e) => (e && e.extendedProperties && e.extendedProperties.private) || {};
          const tagOf = (e) => priv(e)[TAG] || "";
          const live = (e) => e && e.status !== "cancelled" && e.start && e.end;
          // One instant per event edge, comparable across calendars: a target
          // hands a dateTime back in its own zone's offset.
          const edge = (t) => (t.dateTime ? String(Date.parse(t.dateTime)) : "d" + t.date);
          const len = (e) => Date.parse(e.end.dateTime || e.end.date) - Date.parse(e.start.dateTime || e.start.date);
          // The same meeting on two calendars shares an iCalUID; the start pins
          // the occurrence.
          const meeting = (e) => (e.iCalUID ? e.iCalUID + "@" + edge(e.start) : "");

          // Busy: a real event (never one of our own blocks) that shows as
          // busy and that you have not declined.
          const busy = (e) => {
            if (!live(e) || tagOf(e)) return false;
            if (e.transparency === "transparent") return false;
            if (e.eventType === "workingLocation") return false;
            const me = (e.attendees || []).find((a) => a.self);
            return !(me && me.responseStatus === "declined");
          };
          // What gets a block on the other calendars.
          const blocks = (e) => busy(e) && !(e.start.date && !mirrorAllDay);

          const title = (e) => (showDetails && e.summary ? e.summary : cfg.block_title);
          const shell = (key, summary) => {
            const b = {
              summary,
              transparency: "opaque",
              visibility: "private",
              reminders: { useDefault: false, overrides: [] },
              extendedProperties: { private: { [TAG]: key } },
            };
            if (cfg.color_id) b.colorId = cfg.color_id;
            return b;
          };
          const when = (t) => {
            if (t.date) return { date: t.date };
            const out = { dateTime: t.dateTime };
            if (t.timeZone) out.timeZone = t.timeZone;
            return out;
          };
          // A block for one event or one occurrence.
          const single = (key, e) => Object.assign(shell(key, title(e)), { start: when(e.start), end: when(e.end) });

          // A repeating event can be mirrored as one repeating block when its
          // rule can be copied as it stands. A COUNT rule cannot: the block
          // starts at the first occurrence still ahead, which would restart
          // the count. Those fall back to one block per occurrence.
          const repeats = (m) => !!m && Array.isArray(m.recurrence) && m.recurrence.length > 0 &&
            !m.recurrence.some((r) => /[:;]COUNT=/i.test(r)) && !!(m.start && (m.start.date || m.start.timeZone));
          const pad = (n) => String(n).padStart(2, "0");
          // The RFC 5545 line that leaves one occurrence out, by its original start.
          const exdate = (t) => {
            if (t.date) return "EXDATE;VALUE=DATE:" + t.date.replace(/-/g, "");
            const d = new Date(Date.parse(t.dateTime));
            return "EXDATE:" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
              pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
          };
          const hash = (s) => {
            let a = 2166136261, b = 5381;
            for (let i = 0; i < s.length; i++) {
              const c = s.charCodeAt(i);
              a = Math.imul(a ^ c, 16777619) >>> 0;
              b = (Math.imul(b, 33) + c) >>> 0;
            }
            return a.toString(16) + b.toString(16);
          };
          // A repeating block: the source's own rule, starting at the first
          // occurrence that needs it, minus the occurrences that do not. Google
          // may hand a rule back reworded, so the block carries a signature of
          // what it was built from, and that is what a later run compares.
          const series = (key, master, first, skipped) => {
            const rules = master.recurrence.concat(Array.from(new Set(skipped.map(exdate))).sort());
            const b = shell(key, title(master));
            if (first.start.date) {
              b.start = { date: first.start.date };
              b.end = { date: first.end.date };
            } else {
              b.start = { dateTime: first.start.dateTime, timeZone: master.start.timeZone };
              b.end = { dateTime: first.end.dateTime, timeZone: (master.end && master.end.timeZone) || master.start.timeZone };
            }
            b.recurrence = rules;
            b.extendedProperties.private[SIG] = hash(JSON.stringify([master.start, master.end, rules]));
            return b;
          };
          const same = (have, want) => {
            if (!!have.recurrence !== !!want.recurrence) return false;
            const look = (have.summary || "") === want.summary &&
              (have.transparency || "opaque") === "opaque" &&
              have.visibility === "private" &&
              (!want.colorId || have.colorId === want.colorId);
            if (want.recurrence) return look && priv(have)[SIG] === want.extendedProperties.private[SIG];
            return look && edge(have.start) === edge(want.start) && edge(have.end) === edge(want.end);
          };

          const creates = [], updates = [], deletes = [];
          const wanted = {};   // "<source> -> <target>": occurrences that should be blocked, for the log line
          let covered = 0;     // occurrences the target had already blocked itself
          let vanished = 0;    // blocks going because their source event is no longer returned
          let repeating = 0;   // repeating blocks wanted
          let adrift = 0;      // occurrences blocked but not wanted, or wanted but not blocked
          const srcNames = Object.keys(srcBy).sort();
          const dstNames = Object.keys(dstBy).sort();

          // Every event the source calendars returned, whether or not it earns a block.
          const present = new Set();
          for (const source of srcNames) {
            for (const e of itemsOf(srcBy[source])) if (e && e.id) present.add(source + "/" + e.id);
            for (const e of itemsOf(srcRawBy[source])) if (e && e.id) present.add(source + "/" + e.id);
          }

          for (const target of dstNames) {
            const existing = itemsOf(dstBy[target]).filter(live);
            const held = new Set(existing.filter((e) => !tagOf(e)).map(meeting).filter(Boolean));

            // Time the target already shows as busy on its own. A source event
            // that sits wholly inside one of these needs no block: you blocked
            // it by hand, or the same commitment is on both calendars as two
            // separate events.
            const own = existing.filter(busy);
            const timed = own.filter((e) => e.start.dateTime)
              .map((e) => [Date.parse(e.start.dateTime), Date.parse(e.end.dateTime)]);
            const days = own.filter((e) => e.start.date).map((e) => [e.start.date, e.end.date]);
            const alreadyBusy = (e) => (e.start.dateTime
              ? timed.some(([a, b]) => a <= Date.parse(e.start.dateTime) && b >= Date.parse(e.end.dateTime))
              : days.some(([a, b]) => a <= e.start.date && b >= e.end.date));

            // Which blocks SHOULD be on this target: "<source>/<event id>" for
            // one event or occurrence, "<source>/<repeating event id>" for a
            // repeating block.
            const want = new Map();
            const seen = new Set();
            const due = {};   // start -> occurrences that should be blocked then
            const add = (source, n) => {
              const pair = source + " -> " + target;
              wanted[pair] = (wanted[pair] || 0) + n;
            };
            const one = (source, e) => {
              const key = source + "/" + e.id;
              want.set(key, single(key, e));
              due[edge(e.start)] = (due[edge(e.start)] || 0) + 1;
              add(source, 1);
            };

            for (const source of removeAll ? [] : srcNames) {
              if (source === target) continue;
              const masters = new Map();   // repeating events, by id
              const dropped = new Map();   // repeating event id -> original starts of its cancelled occurrences
              for (const r of itemsOf(srcRawBy[source])) {
                if (!r || !r.id) continue;
                if (Array.isArray(r.recurrence) && r.recurrence.length) masters.set(r.id, r);
                else if (r.recurringEventId && r.status === "cancelled" && r.originalStartTime) {
                  if (!dropped.has(r.recurringEventId)) dropped.set(r.recurringEventId, []);
                  dropped.get(r.recurringEventId).push(r.originalStartTime);
                }
              }

              const runs = new Map();      // repeating event id -> its occurrences in the window
              for (const e of itemsOf(srcBy[source])) {
                if (!live(e)) continue;
                let needs = blocks(e);
                if (needs) {
                  const m = meeting(e);
                  // The target already has this meeting itself, or another
                  // source already supplied a block for it.
                  if (m && (held.has(m) || seen.has(m))) needs = false;
                  else if (alreadyBusy(e)) { covered++; needs = false; }
                  else if (m) seen.add(m);
                }
                const rid = e.recurringEventId;
                if (rid && e.originalStartTime && repeats(masters.get(rid))) {
                  if (!runs.has(rid)) runs.set(rid, []);
                  runs.get(rid).push({ e, needs });
                } else if (needs) {
                  one(source, e);
                }
              }

              for (const [rid, occ] of runs) {
                const master = masters.get(rid);
                // On the rule: where and as long as the rule puts it.
                const onRule = (e) => edge(e.start) === edge(e.originalStartTime) && len(e) === len(master);
                const keep = occ.filter((o) => o.needs && onRule(o.e));
                const skip = occ.filter((o) => !(o.needs && onRule(o.e)));
                const gone = dropped.get(rid) || [];
                // One repeating block when most occurrences ahead need it.
                // Otherwise the few that do get a block each.
                if (keep.length && keep.length >= skip.length + gone.length) {
                  keep.sort((x, y) => Date.parse(x.e.start.dateTime || x.e.start.date) - Date.parse(y.e.start.dateTime || y.e.start.date));
                  const key = source + "/" + rid;
                  want.set(key, series(key, master, keep[0].e, skip.map((o) => o.e.originalStartTime).concat(gone)));
                  repeating++;
                  add(source, keep.length);
                  for (const o of keep) due[edge(o.e.start)] = (due[edge(o.e.start)] || 0) + 1;
                  // Moved or resized, yet still busy: a block of its own.
                  for (const o of skip) if (o.needs) one(source, o.e);
                } else {
                  for (const o of occ) if (o.needs) one(source, o.e);
                }
              }
            }

            // How far the calendar is from that, counted in occurrences. It is
            // non-zero before a run writes; a number that stays up afterwards
            // means a repeating block is not landing where the plan expects.
            const have = {};
            for (const e of existing) if (tagOf(e)) have[edge(e.start)] = (have[edge(e.start)] || 0) + 1;
            for (const k of new Set(Object.keys(due).concat(Object.keys(have)))) {
              adrift += Math.abs((due[k] || 0) - (have[k] || 0));
            }

            // Which blocks ARE on it: this pack's events, a repeating block
            // counted once. A key seen twice is a duplicate (two runs raced);
            // the first is kept, the rest go.
            const mine = itemsOf(dstRawBy[target]).filter((e) => live(e) && tagOf(e) && !e.recurringEventId);
            const kept = new Set();
            for (const e of mine) {
              const key = tagOf(e);
              if (!want.has(key) || kept.has(key)) {
                deletes.push({ target, event_id: e.id });
                // Its source calendar is still bound, yet the event is gone.
                if (!want.has(key) && !present.has(key) && srcNames.includes(key.split("/")[0])) vanished++;
                continue;
              }
              kept.add(key);
              const w = want.get(key);
              if (!same(e, w)) updates.push({ target, event_id: e.id, event: w });
            }
            for (const [key, w] of want) {
              if (!kept.has(key)) creates.push({ target, event: w });
            }
          }

          // Blocks going because their event was cancelled, or because a source
          // came back empty. The two look alike, so a large number stops the run.
          // Blocks going for a reason the plan can see (declined, marked free,
          // already blocked on the target, source unbound) are not counted.
          if (!removeAll && vanished > maxDeletes) {
            throw new Error(
              "refusing to delete " + vanished + " blocks whose source events are gone (max_deletes is " +
              maxDeletes + "); check the source calendars read correctly, or raise max_deletes"
            );
          }
          // A run does at most `batch` of each; a for_each over more than
          // policy.max_fan_out items is refused outright. What is left over is
          // simply still missing on the next run, which plans it again.
          const left = Math.max(creates.length - batch, 0) + Math.max(updates.length - batch, 0) +
            Math.max(deletes.length - batch, 0);
          return {
            creates: creates.slice(0, batch),
            updates: updates.slice(0, batch),
            deletes: deletes.slice(0, batch),
            pending: left,
            adrift,
            summary: creates.length + " to create, " + updates.length + " to change, " + deletes.length +
              " to remove across " + dstNames.length + " target(s) from " + srcNames.length + " source(s)" +
              "; occurrences to block: " + (Object.keys(wanted).sort().map((k) => k + " " + wanted[k]).join(", ") || "none") +
              (repeating ? "; " + repeating + " repeating block(s)" : "") +
              (covered ? "; " + covered + " already blocked on the target" : "") +
              (adrift ? "; " + adrift + " occurrence(s) not yet in step" : "") +
              (removeAll ? "; remove_all is on" : "") +
              (left ? "; batch_size " + batch + ", " + left + " left for later runs" : ""),
          };

      - log: "calendar-busy-sync: {{.plan.summary}}"

      - id: create
        if: "!${settings.dry_run}"
        for_each: "{{.plan.creates}}"
        uses: targets.event_create
        member: "{{.item.target}}"
        options:
          event: "{{.item.event}}"

      - id: move
        if: "!${settings.dry_run}"
        for_each: "{{.plan.updates}}"
        uses: targets.event_update
        member: "{{.item.target}}"
        options:
          event_id: "{{.item.event_id}}"
          event: "{{.item.event}}"

      - id: remove
        if: "!${settings.dry_run}"
        for_each: "{{.plan.deletes}}"
        uses: targets.event_delete
        member: "{{.item.target}}"
        options:
          event_id: "{{.item.event_id}}"

# conductor counts every run of a trigger against one target as an "attempt",
# backs off past max_attempts_per_head (3 by default) and PARKS the trigger for
# good at twice that. That suits a fixer retrying one PR; a calendar or a cron
# schedule is one target forever, so a sweep would stop after six runs. These
# triggers are meant to run indefinitely, so the threshold is lifted. One run
# at a time per trigger keeps two reconciles from racing each other.
x-policy:
  always: &always
    max_attempts_per_head: 1000000000
    concurrency: { max_runs: 1 }

# Both triggers ship DISARMED. Arming them in the instance block is the consent
# to write to the calendars you bound as `targets`.
triggers:
  # Push-driven: fires seconds after any source calendar changes (the
  # connector's `changed` source; needs `watch:` on each source connector).
  - name: on_change
    "on": sources.changed
    policy: *always
    steps:
      - id: run
        call: reconcile

  # The backstop. Google push is best-effort and nothing arrives while the
  # daemon is down, so a periodic pass turns a missed push into latency rather
  # than a missing block. It also rolls the window forward. KEEP IT ARMED.
  - name: sweep
    "on": cron.busy_sync
    policy: *always
    steps:
      - id: run
        call: reconcile
