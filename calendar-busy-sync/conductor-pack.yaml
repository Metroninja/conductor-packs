# calendar-busy-sync — a distributable conductor pack.
#
# Keeps "Busy" blocks in sync across Google calendars, the way BusyBridge's
# Ghost-Main mode does, with no UI and no database:
#
#   personal_1, personal_2   read-only sources (e.g. a personal Gmail, a
#                            calendar at another org you can only read)
#   client_1, client_2       the calendars that RECEIVE busy blocks; each is
#                            also a source for the other
#
# Rules (BusyBridge's, see README "Rules"):
#   personal -> both clients   timed events only (all-day: sync_personal_all_day)
#                              — a Free event still blocks
#   client   -> other client   all-day events block too; a Free event does not
#   every source               skips cancelled, declined, out-of-office, and any
#                              event whose description has `[nosync]`
#   blocks                     "Busy", opaque, private, tagged `[Busy]` in the
#                              description; past blocks are left as they are
#
# State lives in the calendars themselves: each block has a deterministic id
# (cbs + 32 hex, from target/source/source-event) and
# extendedProperties.private.cbs=1, so every run recomputes the full diff
# from what Google says and is idempotent. Push (`<conn>.changed`) gives
# seconds of latency; the cron schedule is the backstop.
#
# Triggers: sync (push + cron + manual), backup (nightly JSON + ICS through
# the backup connector), verify (weekly restore test), cleanup (manual,
# one-time: retire BusyBridge's own blocks from today on, keep the past).
#
# INSTALL — see README.md for the full config (connectors, auth, push).

pack:
  name: calendar-busy-sync
  version: 1.0.0
  description: Mirror busy time across Google calendars as private "Busy" blocks (BusyBridge's rules), driven by Google push with a cron backstop; nightly ICS/JSON backups with restore tests; a one-time BusyBridge cleanup.
  tags: [calendar, google-calendar, busy, sync, backup]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # serialize: (0.86), set:/fail: helpers, file: code for js, list-form on:.
    conductor: ">=0.105.0"
    connectors:
      # Four sockets of ONE type, so none auto-binds: bind each explicitly,
      #   connectors: { personal_1: gcal-gmail, personal_2: gcal-tap,
      #                 client_1: gcal-teachermade, client_2: gcal-ednition }
      # >=1.2.0: `events` follows every result page (a 60-day window is often
      # more than Google's first 250) and the `changed` push source.
      personal_1: ">=1.2.0"
      personal_2: ">=1.2.0"
      client_1: ">=1.2.0"
      client_2: ">=1.2.0"
      cron: "*"
      backup: ">=1.0.0"

settings:
  dry_run:
    type: boolean
    default: true
    desc: "Plan only: the sync reads, computes, and reports what it would write, and writes nothing. Watch a few runs, then set false."
  lookahead_days:
    type: integer
    default: 60
    desc: "How far ahead blocks are kept, in days from now."
  busy_title:
    type: string
    default: Busy
    desc: "Title of every busy block."
  managed_tag:
    type: string
    default: "[Busy]"
    desc: "Written as each block's description, so you can search a calendar for every block this pack owns."
  nosync_tag:
    type: string
    default: "[nosync]"
    desc: "An event whose description contains this (any case) is never mirrored."
  sync_personal_all_day:
    type: boolean
    default: false
    desc: "Mirror all-day events from the personal (read-only) calendars. Client all-day events always mirror."
  sync_out_of_office:
    type: boolean
    default: false
    desc: "Mirror out-of-office events. Off: OOO on one calendar does not block the others."
  max_writes:
    type: integer
    default: 200
    desc: "Writes per run. The rest is deferred to the next run (the first fill takes a few)."
  max_deletes:
    type: integer
    default: 50
    desc: "A run that would delete more blocks than this fails instead (a source that read back empty looks exactly like that)."
  max_fan_out:
    type: integer
    default: 100
    desc: "Most writes of one kind (create/update/delete) on one calendar per run. Keep it at or under your policy.max_fan_out (default 100)."
  backup_tiers:
    type: string
    default: ""
    desc: "Comma-separated backup tiers to write and verify. Empty: every tier of the bound backup connector."
  backup_prefix:
    type: string
    default: calendar
    desc: "Backup set names are <prefix>-<socket>-json / -ics (e.g. calendar-client-1-ics)."
  backup_days_back:
    type: integer
    default: 365
    desc: "The backup covers events from this many days ago..."
  backup_days_ahead:
    type: integer
    default: 730
    desc: "...to this many days ahead (recurring events are kept as one series)."
  cleanup_max_ops:
    type: integer
    default: 1000
    desc: "The cleanup refuses to make more changes than this in one run."

workflows:
  # ---------------------------------------------------------------- sync
  sync:
    description: "Read every calendar's next lookahead_days, diff the busy blocks the client calendars should hold against the ones they do, and write the difference."
    steps:
      - id: cfg
        set:
          mode: plan
          dry_run: "${settings.dry_run}"
          lookahead_days: "${settings.lookahead_days}"
          busy_title: "${settings.busy_title}"
          managed_tag: "${settings.managed_tag}"
          nosync_tag: "${settings.nosync_tag}"
          sync_personal_all_day: "${settings.sync_personal_all_day}"
          sync_out_of_office: "${settings.sync_out_of_office}"
          max_writes: "${settings.max_writes}"
          max_deletes: "${settings.max_deletes}"
          max_fan_out: "${settings.max_fan_out}"
      - id: win
        use: js
        code: |
          const days = Number(ctx.cfg.lookahead_days);
          if (!(days > 0)) throw new Error("lookahead_days must be a positive number");
          const now = new Date();
          return { min: now.toISOString(), max: new Date(now.getTime() + days * 86400000).toISOString() };
      # showDeleted: a block deleted by hand comes back cancelled, and its id
      # can never be created again — the plan restores it instead.
      - parallel:
          - - id: read_personal_1
              progress: reading personal_1
              uses: personal_1.events
              options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: true, showDeleted: true, maxResults: 2500 }
          - - id: read_personal_2
              progress: reading personal_2
              uses: personal_2.events
              options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: true, showDeleted: true, maxResults: 2500 }
          - - id: read_client_1
              progress: reading client_1
              uses: client_1.events
              options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: true, showDeleted: true, maxResults: 2500 }
          - - id: read_client_2
              progress: reading client_2
              uses: client_2.events
              options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: true, showDeleted: true, maxResults: 2500 }
      - id: plan
        use: js
        code: "file:${pack.dir}/busy.js"
      - log: "busy sync: {{.plan.summary}}{{if .plan.dry_run}} (dry run, nothing written: {{.plan.would}}){{end}}{{if .plan.deferred}} — {{.plan.deferred}} deferred to the next run{{end}}"
      # Writes. Deletes first (they free time), then creates, then repairs.
      # Each fans out 8-wide and keeps going past a failed item; `applied`
      # fails the run at the end if any did, and the next run retries.
      - { id: apply_client_1_delete, for_each: "{{.plan.client_1.delete}}", parallel: true, continue_on_error: true, progress: removing stale blocks on client_1,
          uses: client_1.event_delete, options: { event_id: "{{.item.event_id}}" } }
      - { id: apply_client_2_delete, for_each: "{{.plan.client_2.delete}}", parallel: true, continue_on_error: true, progress: removing stale blocks on client_2,
          uses: client_2.event_delete, options: { event_id: "{{.item.event_id}}" } }
      - { id: apply_client_1_create, for_each: "{{.plan.client_1.create}}", parallel: true, continue_on_error: true, progress: adding blocks on client_1,
          uses: client_1.event_create, options: { event: "{{.item.event}}" } }
      - { id: apply_client_2_create, for_each: "{{.plan.client_2.create}}", parallel: true, continue_on_error: true, progress: adding blocks on client_2,
          uses: client_2.event_create, options: { event: "{{.item.event}}" } }
      - { id: apply_client_1_update, for_each: "{{.plan.client_1.update}}", parallel: true, continue_on_error: true, progress: repairing blocks on client_1,
          uses: client_1.event_update, options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
      - { id: apply_client_2_update, for_each: "{{.plan.client_2.update}}", parallel: true, continue_on_error: true, progress: repairing blocks on client_2,
          uses: client_2.event_update, options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
      - id: applied
        use: js
        code: |
          const bad = Object.keys(ctx).filter((k) => k.indexOf("apply_") === 0 && ctx[k] && ctx[k].failed);
          if (bad.length) throw new Error("some block writes failed, the next run retries them: " + bad.map((k) => k + ": " + ctx[k].error).join("; "));
          return { writes: ctx.plan.writes };

  # ---------------------------------------------------------------- backup
  backup:
    description: "Snapshot every calendar (raw API JSON, re-insertable, and ICS) into the backup connector's tiers; unchanged snapshots are skipped, each tier's retention applies."
    steps:
      - id: cfg
        set: { mode: snapshots, backup_prefix: "${settings.backup_prefix}" }
      - id: win
        use: js
        code: |
          const back = Number("${settings.backup_days_back}"), ahead = Number("${settings.backup_days_ahead}");
          const now = Date.now();
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { min: new Date(now - back * 86400000).toISOString(), max: new Date(now + ahead * 86400000).toISOString(), tiers: tiers };
      - parallel:
          - - { id: read_personal_1, uses: personal_1.events, options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
          - - { id: read_personal_2, uses: personal_2.events, options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
          - - { id: read_client_1, uses: client_1.events, options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
          - - { id: read_client_2, uses: client_2.events, options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
      - id: snap
        use: js
        code: "file:${pack.dir}/busy.js"
      - id: put
        for_each: "{{.snap.snapshots}}"
        progress: writing backups
        uses: backup.put
        options: { set: "{{.item.set}}", ext: "{{.item.ext}}", text: "{{.item.text}}", tiers: "{{.win.tiers}}" }

  # ---------------------------------------------------------------- verify
  verify:
    description: "Restore test: restore each set's newest snapshot from every tier and check it against its recorded sha256/size, plus the backend's own consistency check."
    steps:
      - id: cfg
        set: { mode: snapshots, backup_prefix: "${settings.backup_prefix}" }
      - id: names
        use: js
        code: |
          const p = ctx.cfg.backup_prefix;
          const sets = [];
          for (const s of ["personal-1", "personal-2", "client-1", "client-2"]) sets.push(p + "-" + s + "-json", p + "-" + s + "-ics");
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { sets: sets, tiers: tiers };
      - id: verify
        for_each: "{{.names.sets}}"
        progress: restore-testing backups
        continue_on_error: true
        uses: backup.verify
        options: { set: "{{.item}}", mode: both, sample: 1, tiers: "{{.names.tiers}}" }
      - id: verified
        use: js
        code: |
          if (ctx.verify.failed) throw new Error("restore test failed: " + ctx.verify.error);
          const bad = [];
          (ctx.verify.items || []).forEach((r, i) => { if (!r || r.ok !== true) bad.push(ctx.names.sets[i]); });
          if (bad.length) throw new Error("restore test failed for: " + bad.join(", "));
          return { verified: (ctx.verify.items || []).length };

triggers:
  # Push from any calendar, the cron backstop, or `conductor run <inst>/sync`.
  # One sync at a time (a burst of pushes queues behind the running sync, and
  # the queued one re-reads everything, so nothing is missed). The writes a
  # sync makes push back a `changed` of their own; that run finds nothing to do.
  - name: sync
    "on":
      - personal_1.changed
      - personal_2.changed
      - client_1.changed
      - client_2.changed
      - cron.busy_sync
      - manual
    serialize: { key: calendar-busy-sync }
    steps:
      - { id: run, workflow: sync }

  - name: backup
    "on": [cron.busy_backup, manual]
    serialize: { key: calendar-busy-sync-backup }
    steps:
      - { id: run, workflow: backup }

  - name: verify
    "on": [cron.busy_verify, manual]
    serialize: { key: calendar-busy-sync-backup }
    steps:
      - { id: run, workflow: verify }

  # Manual only: `conductor run <inst>/cleanup` reports; add
  # `--input apply=true` to make the changes. Shares the sync's key, so it
  # never runs alongside a sync.
  - name: cleanup
    "on": manual
    serialize: { key: calendar-busy-sync }
    # Inline rather than a workflow: it reads the manual run's --input apply.
    steps:
    - id: cfg
      set:
        mode: cleanup
        cleanup_apply: "{{.inputs.apply}}"
        cleanup_max_ops: "${settings.cleanup_max_ops}"
    - id: win
      use: js
      code: "return { min: new Date().toISOString() };"
    # Not expanded: a recurring series is one master (whose RRULE gets an
    # UNTIL) plus its exceptions, not hundreds of instances.
    - parallel:
        - - { id: read_client_1, uses: client_1.events, options: { timeMin: "{{.win.min}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
        - - { id: read_client_2, uses: client_2.events, options: { timeMin: "{{.win.min}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
    - id: plan
      use: js
      code: "file:${pack.dir}/busy.js"
    - log: "busybridge cleanup: {{.plan.summary}}{{if not .plan.apply}} (report only — run again with --input apply=true to make these changes; sample: {{.plan.sample}}){{end}}"
    - { id: cleanup_client_1_delete, for_each: "{{.plan.client_1.delete}}", parallel: true, continue_on_error: true,
        uses: client_1.event_delete, options: { event_id: "{{.item.event_id}}" } }
    - { id: cleanup_client_2_delete, for_each: "{{.plan.client_2.delete}}", parallel: true, continue_on_error: true,
        uses: client_2.event_delete, options: { event_id: "{{.item.event_id}}" } }
    - { id: cleanup_client_1_end, for_each: "{{.plan.client_1.patch}}", parallel: true, continue_on_error: true,
        uses: client_1.event_update, options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
    - { id: cleanup_client_2_end, for_each: "{{.plan.client_2.patch}}", parallel: true, continue_on_error: true,
        uses: client_2.event_update, options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
    - id: applied
      use: js
      code: |
        const bad = Object.keys(ctx).filter((k) => k.indexOf("cleanup_") === 0 && ctx[k] && ctx[k].failed);
        if (bad.length) throw new Error("some cleanup writes failed (run cleanup again; it only touches what is left): " + bad.map((k) => k + ": " + ctx[k].error).join("; "));
        return { ok: true };
